name: Build PassaTempoDuelm APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Unpack project
        run: |
          rm -rf buildsrc
          mkdir buildsrc
          unzip -q PassaTempoDuelm_android_project.zip -d buildsrc
          test -f buildsrc/PassaTempoDuelm/settings.gradle.kts

      - name: Build APK
        working-directory: buildsrc/PassaTempoDuelm
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PassaTempoDuelm-debug-apk
          path: buildsrc/PassaTempoDuelm/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
